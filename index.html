const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0,maximumFractionDigits:2}).format(n||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), date=x=>new Date(x).toLocaleString('es-AR'), round=n=>Math.round(n/100)*100;

function parseNumber(value){let s=String(value).trim();if(!s)return 0;if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))return Number(s.replace(/\./g,'').replace(',','.'));if(/^-?\d+(,\d+)?$/.test(s))return Number(s.replace(',','.'));if(/^-?\d+\.\d{1,2}$/.test(s))return Number(s);return NaN}

const table=(heads,rows)=>`<div class="table"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="muted">Sin registros todavía.</td></tr>`}</tbody></table></div>`, field=(label,id,type='text',value='',extra='')=>`<div><label for="${id}">${label}</label><input id="${id}" type="${type==='number'?'text':type}" ${type==='number'?'data-number inputmode="decimal" autocomplete="off"':''} value="${esc(type==='number'&&value!==''?fmtNumber(value):value)}" ${extra}></div>`, card=(label,value)=>`<div class="panel"><div class="muted">${label}</div><div class="big">${value}</div></div>`;function allowedPages(){return db.user?.role==='admin'?['Mostrador','Stock y precios','Caja actual','Historial de cajas','Estadísticas','Notificaciones','Configuración']:['Mostrador','Stock y precios']}function go(p){if(!allowedPages().includes(p))return;page=p;render()}function show(html){$('modal').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function fail(t){alert(t)}function render(){const s=current();if(!allowedPages().includes(page))page='Mostrador';$('nav').innerHTML=allowedPages().map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('');$('title').textContent=page;$('userLabel').textContent=db.user?.name||'';$('status').textContent=s?'Caja abierta · '+(s.openedBy?.name||s.operator):'Caja cerrada';let v=$('view');if(page==='Mostrador'){v.innerHTML=`<div class="grid">${card('Ventas de la caja',money(revenue(s)))}${card('Operaciones',sales(s).length)}${card('Productos con stock bajo',db.products.filter(p=>p.qty<=p.min).length)}</div>${!s?'<div class="panel"><h3>Abrí una caja para empezar a vender</h3><button onclick="openCash()">Abrir caja</button></div>':`<div class="panel"><div class="actions" style="justify-content:space-between;align-items:center;margin:0"><div><b>Caja abierta</b> · ${esc(s.openedBy?.name||s.operator)}<div class="muted">Desde ${date(s.at)}</div></div><button class="danger" onclick="closeCash()">Cerrar caja</button></div></div>`}<div class="two"><div class="panel"><h3>Buscar o escanear producto</h3><input id="scan" placeholder="Código de barras o nombre" autocomplete="off" oninput="catalog(this.value)" onkeydown="if(event.key===\'Enter\'){scanCode(this.value);event.preventDefault()}"><div id="catalog"></div></div><div class="panel"><h3>Venta actual</h3><div id="cart"></div></div></div>`;catalog('');drawCart();$('scan').focus()}else if(page==='Stock y precios'){v.innerHTML=`<div class="actions" style="margin:0 0 16px"><button onclick="editProduct()">+ Nuevo producto</button><button class="secondary" onclick="exportStock()">Exportar stock CSV</button></div><div class="panel"><input id="filter" placeholder="Buscar por nombre, categoría o código" oninput="stockTable(this.value)"><div id="stockTable"></div></div><div class="panel"><h3>Movimientos de inventario</h3>${table(['Fecha','Producto','Cantidad','Motivo','Responsable'],db.moves.slice().reverse().map(m=>[date(m.at),esc(m.name),m.delta,esc(m.reason),esc(m.actor?.name||'—')]))}</div>`;stockTable('')}else if(page==='Caja actual'){v.innerHTML=s?`<div class="grid">${card('Fondo inicial',money(s.open))}${card('Ventas totales',money(revenue(s)))}${card('Efectivo esperado',money(expected(s)))}</div><div class="panel"><h3>${esc(s.operator)} · ${date(s.at)}</h3>${report(s)}<div class="actions"><button onclick="movement()">Ingreso / retiro</button><button class="secondary" onclick="reportModal('${s.id}')">Ver informe</button><button class="danger" onclick="closeCash()">Cerrar caja</button></div></div>`:`<div class="panel"><h3>No hay caja abierta</h3><button onclick="openCash()">Abrir caja</button></div>`}else if(page==='Historial de cajas'){v.innerHTML=`<div class="panel">${table(['Apertura','Abrió','Cierre','Cerró','Ventas','Diferencia','Informe'],db.sessions.slice().rev function catalog(q){q=q.toLowerCase();$('catalog').innerHTML=table(['Producto','Stock','Precio',''],db.products.filter(p=>`${p.name} ${p.code}`.toLowerCase().includes(q)).slice(0,30).map(p=>[esc(p.name),p.qty,money(p.price),`<button onclick="add('${p.id}')">+</button>`]))}function scanCode(q){let p=db.products.find(p=>p.code===q.trim());if(p){add(p.id);$('scan').value='';catalog('')}else{fail('Código no encontrado. Cargá el producto en Stock.')}}function add(id){if(!current())return fail('Primero abrí una caja');let p=db.products.find(p=>p.id===id),i=cart.find(i=>i.id===id);if(!p)return fail('Producto no disponible');if((i?.qty||0)>=p.qty)return fail('Stock insuficiente');if(i)i.qty++;else cart.push({...p,qty:1});drawCart();$('scan')?.focus()}function change(id,d){let i=cart.find(i=>i.id===id),p=db.products.find(p=>p.id===id);if(!p||i.qty+d>p.qty)return fail('Stock insuficiente');i.qty+=d;cart=cart.filter(i=>i.qty>0);drawCart()}function drawCart(){let c=$('cart');if(!c)return;let total=sum(cart.map(i=>i.qty*i.price));c.innerHTML=table(['Producto','Cant.','Subtotal'],cart.map(i=>[esc(i.name),`<button class="secondary" onclick="change('${i.id}',-1)">−</button> ${i.qty} <button class="secondary" onclick="change('${i.id}',1)">+</button>`,money(i.qty*i.price)]))+`<p class="muted">Total a cobrar</p><div class="total">${money(total)}</div><div class="actions"><button onclick="checkout()" ${cart.length?'':'disabled'}>Cobrar venta</button><button class="secondary" onclick="cart=[];drawCart()">Cancelar</button></div>`}
function openCash(){show(`<h2>Apertura de caja</h2><form onsubmit="event.preventDefault();startCash()"><p>Responsable: <b>${esc(db.user.name)}</b></p>${field('Fondo inicial en efectivo','opening','number',0,'min="0" required')}<div class="actions"><button>Abrir caja</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function startCash(){if(current())return;await mutateUI('open',{open:readNum('opening')})}function checkout(){if(!cart.length||!current())return;const t=sum(cart.map(i=>i.qty*i.price));show(`<h2>Cobrar ${money(t)}</h2><form onsubmit="event.preventDefault();commitSale()"><label>Medio de pago</label><div class="grid payment-options"><button type="button" id="methodCash" onclick="choosePayment('cash')">Efectivo</button><button type="button" id="methodMP" onclick="choosePayment('mp')">Mercado Pago</button><button type="button" id="methodBoth" onclick="choosePayment('both')">Ambos</button></div><div id="paymentFields" class="grid" style="margin-top:16px"></div><p id="balancePay"></p><div class="actions"><button>Confirmar venta</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`);choosePayment('cash')}
let paymentMode='cash';
function choosePayment(mode){paymentMode=mode;const t=sum(cart.map(i=>i.qty*i.price));['Cash','MP','Both'].forEach((x,i)=>$('method'+x).className=mode===['cash','mp','both'][i]?'':'secondary');$('paymentFields').innerHTML=mode==='cash'?field('Efectivo recibido','cashPaid','number',t,'min="0" step="1" required oninput="paymentBalance()"'):mode==='mp'?field('Mercado Pago','mpPaid','number',t,'readonly'):field('Importe Mercado Pago','mpPaid','number','','min="1" step="1" required oninput="splitPayment(\'mp\')"')+field('Efectivo recibido','cashPaid','number',t,'min="1" step="1" required oninput="splitPayment(\'cash\')"');paymentBalance()}
function splitPayment(from){const total=sum(cart.map(i=>i.qty*i.price));if(from==='mp'){const mp=readNum('mpPaid');if(Number.isFinite(mp)&&mp>=0&&mp<=total)$('cashPaid').value=fmtNumber(total-mp)}else{const cash=readNum('cashPaid');if(Number.isFinite(cash)&&cash>0&&cash<total&&(!Number.isFinite(readNum('mpPaid'))||!readNum('mpPaid')||readNum('mpPaid')+cash<total))$('mpPaid').value=fmtNumber(total-cash)}paymentBalance()}
function paymentBalance(){const t=sum(cart.map(i=>i.qty*i.price)),cash=$('cashPaid')?readNum('cashPaid'):0,mp=$('mpPaid')?readNum('mpPaid'):0;const valid=Number.isFinite(cash)&&Number.isFinite(mp)&&mp>=0&&mp<=t&&cash>=0;const balance=$('balancePay');balance.textContent=valid?'Pendiente: '+money(Math.max(0,t-cash-mp))+' · Vuelto en efectivo: '+money(Math.max(0,cash+mp-t)):'Revisá los importes ingresados';balance.className=valid&&cash+mp>=t?'':'warn'}
async function commitSale(){let s=current(),total=sum(cart.map(i=>i.qty*i.price)),cash=$('cashPaid')?readNum('cashPaid'):0,mp=$('mpPaid')?readNum('mpPaid'):0;if(!s||!Number.isSafeInteger(cash)||!Number.isSafeInteger(mp)||cash<0||mp<0||mp>total||cash+mp<total||(paymentMode==='both'&&(mp<=0||mp>=total||cash<=0)))return fail('Revisá los importes. En pago combinado ambos medios deben tener un importe mayor a cero.');const payments=[{method:'Efectivo',amount:total-mp},{method:'Mercado Pago',amount:mp}].filter(p=>p.amount>0);await mutateUI('sale',{sessionId:s.id,items:cart.map(i=>({id:i.id,qty:i.qty,price:i.price})),payments},()=>{cart=[]})}
function stockTable(q){q=q.toLowerCase();$('stockTable').innerHTML=table(['Código','Producto','Costo','Recargo','Precio','Stock','Última modificación',''],db.products.filter(p=>`${p.code} ${p.name} ${p.category}`.toLowerCase().includes(q)).map(p=>[esc(p.code),esc(p.name),money(p.cost),fmtNumber(p.margin)+'%',money(p.price),`<span class="${p.qty<=p.min?'warn':''}">${p.qty}</span>`,esc(p.updatedBy?.name||'—')+(p.updatedAt?' · '+date(p.updatedAt):''),`<button class="secondary" onclick="editProduct('${p.id}')">Editar</button> <button onclick="adjust('${p.id}')">Stock</button>`]))}function editProduct(id){newProductId=id||uid();let p=db.products.find(p=>p.id===id)||{code:'',name:'',category:'',cost:0,margin:30,price:0,qty:0,min:5,packSize:1};show(`<h2>${id?'Editar':'Nuevo'} producto</h2><form onsubmit="event.preventDefault();storeProduct('${id||''}')"><div class="grid">${field('Código de barras (EAN-13 u otro)','code','text',p.code,'autocomplete="off" onkeydown="if(event.key===\'Enter\'){event.preventDefault();document.getElementById(\'name\').focus()}"')}${field('Nombre','name','text',p.name,'required')}${field('Categoría','category','text',p.category)}<div><label for="purchaseMode">Presentación de compra</label><select id="purchaseMode" onchange="purchaseModeChanged()"><option value="unit">Unidad</option><option value="pack">Pack / bulto</option></select></div><div id="packFields" hidden>${field('Unidades por pack','packSize','number',p.packSize||1,'min="1" step="1" oninput="suggest(true)"')}</div>${field('Costo unitario de compra','cost','number',p.cost,'min="0" step="0.01" required oninput="suggest(true)"')}${field('Recargo sobre costo (%)','margin','number',p.margin,'min="0" step="0.01" oninput="suggest(true)"')}${field('Precio de venta por unidad','price','number',p.price,'min="1" step="1" required')}${field(id?'Stock actual (unidades)':'Cantidad de unidades compradas','qty','number',p.qty,'min="0" step="1" required '+(id?'readonly':'oninput="suggest(false)"'))}${field('Stock mínimo (unidades)','min','number',p.min,'min="0" step="1" required')}</div><p id="packSummary" class="muted"></p><p id="suggestion"></p><button type="button" class="secondary" onclick="suggest(true)">Aplicar precio sugerido</button><div class="actions"><button>Guardar producto</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`);$('qty').dataset.edit=id?'1':'0';$('packSize').disabled=true;suggest(!id);$('code').focus()}
function purchaseModeChanged(){const pack=$('purchaseMode').value==='pack';$('packFields').hidden=!pack;$('packSize').disabled=!pack;const size=Math.max(1,readNum('packSize')||1),c=readNum('cost');$('cost').value=fmtNumber(pack?c*size:c/size);document.querySelector('label[for="cost"]').textContent=pack?'Costo total del pack':'Costo unitario de compra';if($('qty').dataset.edit!=='1'){document.querySelector('label[for="qty"]').textContent=pack?'Cantidad de packs comprados':'Cantidad de unidades compradas';$('qty').value='0'}suggest(true)}
function purchaseValues(){const pack=$('purchaseMode').value==='pack',size=pack?readNum('packSize'):1,cost=readNum('cost'),count=readNum('qty');return {mode:pack?'pack':'unit',unitsPerPack:size,cost,count,unitCost:cost/size,units:count*size}}
function suggest(apply=false){const p=purchaseValues(),m=readNum('margin'),n=p.unitCost*(1+m/100),r=round(n);const ok=Number.isFinite(n)&&Number.isSafeInteger(p.unitsPerPack)&&p.unitsPerPack>0&&p.cost>=0&&Number.isFinite(m)&&m>=0;$('packSummary').textContent=ok?'Costo por unidad: '+money(p.unitCost)+($('qty').dataset.edit!=='1'?' · Stock a ingresar: '+fmtNumber(p.units)+' unidades':''): 'Revisá el costo y las unidades por pack.';$('suggestion').textContent=ok?'Precio calculado por unidad: '+money(n)+' · Sugerido redondeado: '+money(r):'No se puede calcular el precio.';if(ok&&(apply||!$('price').value||readNum('price')===0)){$('price').value=fmtNumber(r);validateNumber($('price'))}}
async function storeProduct(id){let old=db.products.find(p=>p.id===id),purchase=purchaseValues(),p={id:id||newProductId,code:$('code').value.trim(),name:$('name').value.trim(),category:$('category').value.trim(),cost:purchase.unitCost,margin:readNum('margin'),price:readNum('price'),qty:id?old?.qty:purchase.units,min:readNum('min')};if(!Number.isSafeInteger(purchase.unitsPerPack)||purchase.unitsPerPack<1||!Number.isFinite(p.cost)||p.cost<0||!Number.isSafeInteger(p.qty)||p.qty<0||!Number.isSafeInteger(p.price)||p.price<1)return fail('Revisá el costo, las cantidades y el precio unitario.');await mutateUI('product',{product:p,purchase:{mode:purchase.mode,unitsPerPack:purchase.unitsPerPack,cost:purchase.cost,count:id?0:purchase.count},edit:!!id,version:old?.updatedAt||null})}
function adjust(id){let p=db.products.find(p=>p.id===id);show(`<h2>Movimiento de stock</h2><p>${esc(p.name)} · Disponible: ${fmtNumber(p.qty)} unidades</p><form onsubmit="event.preventDefault();applyAdjust('${id}')"><div class="grid"><div><label for="adjustMode">Presentación</label><select id="adjustMode" onchange="adjustPreview()"><option value="unit">Unidades</option><option value="pack">Packs / bultos</option></select></div><div id="adjustPack" hidden>${field('Unidades por pack','adjustSize','number',p.packSize||1,'min="1" step="1" oninput="adjustPreview()"')}</div>${field('Cantidad (negativa para retirar)','delta','number',0,'step="1" required oninput="adjustPreview()"')}${field('Costo de compra por presentación (opcional)','adjustCost','number','','min="0" step="0.01" oninput="adjustPreview()"')}${field('Motivo','reason','text','Ingreso de mercadería','required')}</div><p id="adjustSummary" class="muted"></p><div class="actions"><button>Guardar</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`);$('adjustMode').dataset.product=id;adjustPreview()}
function adjustPreview(){const pack=$('adjustMode').value==='pack';$('adjustPack').hidden=!pack;$('adjustSize').disabled=!pack;const size=pack?readNum('adjustSize'):1,delta=readNum('delta')*size,p=db.products.find(x=>x.id===$('adjustMode').dataset.product),cost=readNum('adjustCost'),hasCost=$('adjustCost').value.trim()!=='';document.querySelector('label[for="delta"]').textContent=pack?'Cantidad de packs (negativa para retirar)':'Cantidad de unidades (negativa para retirar)';document.querySelector('label[for="adjustCost"]').textContent=pack?'Costo de compra por pack (opcional)':'Costo de compra por unidad (opcional)';$('adjustSummary').textContent=Number.isSafeInteger(delta)&&size>=1?'Movimiento: '+fmtNumber(delta)+' unidades · Stock final: '+fmtNumber(p.qty+delta)+(hasCost&&delta>0?' · Nuevo costo unitario: '+money(cost/size)+' · Nuevo precio sugerido: '+money(round(cost/size*(1+p.margin/100))):''):'Revisá la cantidad ingresada'}
async function applyAdjust(id){const pack=$('adjustMode').value==='pack',size=pack?readNum('adjustSize'):1,count=readNum('delta'),delta=count*size,hasCost=$('adjustCost').value.trim()!=='';if(!Number.isSafeInteger(size)||size<1||!Number.isSafeInteger(delta)||!delta||(hasCost&&(delta<0||!Number.isFinite(readNum('adjustCost'))||readNum('adjustCost')<0)))return fail('Revisá el movimiento. Solo se actualiza el costo en ingresos de mercadería.');await mutateUI('adjust',{id,delta,reason:$('reason').value.trim(),purchase:{mode:pack?'pack':'unit',unitsPerPack:size,count,...(hasCost?{cost:readNum('adjustCost')}:{})}})}
function movement(){show(`<h2>Ingreso o retiro de efectivo</h2><form onsubmit="event.preventDefault();applyMovement()">${field('Importe (negativo para retiro)','amount','number',0,'required step="1"')}${field('Motivo','reason','text','','required')}<div class="actions"><button>Guardar</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function applyMovement(){await mutateUI('cashMove',{sessionId:current()?.id,amount:readNum('amount'),reason:$('reason').value.trim()})}function closeCash(){let s=current();if(cart.length)return fail('Finalizá o cancelá la venta pendiente');show(`<h2>Cierre de caja</h2><p>Efectivo esperado: <b>${money(expected(s))}</b></p><form onsubmit="event.preventDefault();finishCash()"><p>Abrió: <b>${esc(s.openedBy?.name||s.operator)}</b><br>Cierra: <b>${esc(db.user.name)}</b></p>${field('Efectivo contado','counted','number','','min="0" required step="1"')}${field('Observaciones','notes')}<div class="actions"><button class="danger">Confirmar cierre</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function finishCash(){let s=current();if(!s)return;await mutateUI('close',{sessionId:s.id,counted:readNum('counted'),notes:$('notes').value},()=>{page=db.user?.role==='admin'?'Historial de cajas':'Mostrador'},()=>{if(db.user?.role==='admin')reportModal(s.id)})}function report(s){let qty={};sales(s).forEach(v=>v.items.forEach(i=>{let k=i.id;if(!qty[k])qty[k]={name:i.name,qty:0,total:0};qty[k].qty+=i.qty;qty[k].total+=i.qty*i.price}));return `<p>Abrió: <b>${esc(s.openedBy?.name||s.operator)}</b> · Cerró: <b>${esc(s.closedBy?.name||s.closer||'Pendiente')}</b></p><p>Fondo inicial: <b>${money(s.open)}</b> · Ventas: <b>${money(revenue(s))}</b></p><h3>Medios de pago</h3>${table(['Medio','Total'],Object.entries(totals(s)).map(([m,a])=>[m,money(a)]))}<h3 style="margin-top:18px">Arqueo de efectivo</h3>${table(['Concepto','Importe'],[['Fondo inicial',money(s.open)],['Ventas en efectivo',money(totals(s).Efectivo)],['Ingresos / retiros',money(sum(s.moves.map(m=>m.amount)))],['Efectivo esperado',money(expected(s))],...(s.closed?[['Efectivo contado',money(s.counted)],['Diferencia',money(s.counted-expected(s))]]:[])])}<h3 style="margin-top:18px">Productos vendidos</h3>${table(['Producto','Cantidad','Total'],Object.values(qty).map(i=>[esc(i.name),i.qty,money(i.total)]))}<h3 style="margin-top:18px">Detalle de ventas</h3>${table(['Hora','Responsable','Productos','Pago','Total'],sales(s).map(v=>[date(v.at),esc(v.actor?.name||'—'),v.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>'),v.payments.map(p=>esc(p.method)+' '+money(p.amount)).join('<br>'),money(v.total)]))}<h3 style="margin-top:18px">Movimientos de efectivo</h3>${table(['Fecha','Motivo','Importe','Responsable'],s.moves.map(m=>[date(m.at),esc(m.reason),money(m.amount),esc(m.actor?.name||'—')]))}`}function reportModal(id){let s=db.sessions.find(s=>s.id===id);show(`<h2>Informe de caja</h2><p>Apertura: ${date(s.at)} · ${esc(s.openedBy?.name||s.operator)}<br>Cierre: ${s.closed?date(s.closed)+' · '+esc(s.closedBy?.name||s.closer):'Pendiente'}<br>${esc(s.notes||'')}</p>${report(s)}<div class="actions"><button onclick="window.print()">Imprimir / guardar PDF</button><button class="secondary" onclick="shareReport('${id}')">Compartir resumen</button><button class="secondary" onclick="closeModal()">Cerrar</button></div>`)}async function shareReport(id){let s=db.sessions.find(s=>s.id===id),text=`Informe de caja\n${date(s.at)}\nAbrió: ${s.openedBy?.name||s.operator}\nCerró: ${s.closedBy?.name||s.closer||'Pendiente'}\nVentas: ${money(revenue(s))}\n`+Object.entries(totals(s)).map(([m,a])=>m+': '+money(a)).join('\n')+'\nEfectivo esperado: '+money(expected(s))+(s.closed?'\nDiferencia: '+money(s.counted-expected(s)):'');try{if(navigator.share)await navigator.share({title:'Informe de caja',text});else download('informe-caja.txt',text,'text/plain')}catch(e){if(e.name!=='AbortError')download('informe-caja.txt',text,'text/plain')}}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportStock(){let csv=[['Código','Nombre','Categoría','Costo','Recargo','Precio','Stock'],...db.products.map(p=>[p.code,p.name,p.category,fmtNumber(p.cost),fmtNumber(p.margin),fmtNumber(p.price),fmtNumber(p.qty)])].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');download('stock.csv','\uFEFF'+csv,'text/csv')}async function restore(){fail('La restauración de respaldos requiere una migración administrativa.')}
function usersPanel(){return `<div class="panel"><h3>Usuarios y permisos</h3><p class="muted">Cada persona tiene su propio acceso. Cobrador: Mostrador y Stock, incluida apertura y cierre de caja. Administrador: acceso completo.</p><button onclick="newUser()">+ Agregar usuario</button><div style="margin-top:14px">${table(['Nombre','Correo','Perfil','Estado'],(db.users||[]).map(u=>[esc(u.name),esc(u.email),roleLabel(u.role),u.active?'Activo':'Inactivo']))}</div></div>`}
function newUser(){if(db.user?.role!=='admin')return;show(`<h2>Agregar usuario</h2><form onsubmit="event.preventDefault();saveUser()"><div class="grid">${field('Nombre y apellido','newName','text','','required maxlength="100" autocomplete="off"')}${field('Correo electrónico','newEmail','email','','required autocomplete="off"')}${field('Contraseña inicial (mín. 8 caracteres)','newPassword','password','','required minlength="8" maxlength="128" autocomplete="new-password"')}<div><label for="newRole">Perfil de acceso</label><select id="newRole"><option value="cashier">Cobrador</option><option value="admin">Administrador</option></select></div></div><p class="muted">El usuario inicia sesión con su propio correo y contraseña.</p><div class="actions"><button>Crear usuario</button><button class="secondary" type="button" onclick="closeModal()">Cancelar</button></div></form>`)}
async function saveUser(){if(db.user?.role!=='admin')return;await mutateUI('createUser',{name:$('newName').value.trim(),email:$('newEmail').value.trim(),password:$('newPassword').value,role:$('newRole').value})}
let toastTimer;window.kioskToast=t=>{let e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,5000)};
window.kioskLocked=()=>{db={products:[],sessions:[],active:null,moves:[],audit:[]};cart=[];pendingRequest=null;page='Mostrador';if($('modal').open)closeModal();$('app').hidden=true;$('login').hidden=false};
window.kioskReady=state=>{db=state;$('login').hidden=true;$('app').hidden=false;render()};
window.kioskPage=()=>page;window.kioskRefresh=async()=>{db=await kioskApi();render()};async function refreshUI(){if(busy)return;try{await kioskRefresh()}catch(e){fail(e.message)}}
let pendingRequest=null;async function mutateUI(action,data,onCommit=()=>{},after=()=>{}){if(busy)return;busy=true;let buttons=[...$('modal').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);const signature=JSON.stringify({action,data});if(!pendingRequest||pendingRequest.signature!==signature)pendingRequest={signature,id:uid()};try{let result=await kioskApi(action,data,pendingRequest.id);pendingRequest=null;onCommit();if($('modal').open)closeModal();try{await kioskRefresh();after()}catch(e){kioskToast('Operación registrada; actualizá la pantalla. '+e.message);return}kioskToast('Operación registrada'+(result.delivery?.status==='error de envío'?' · Push pendiente de revisión':''))}catch(e){fail(e.message)}finally{busy=false;buttons.forEach(b=>b.disabled=false)}}
async function activatePush(){try{await kioskSubscribe();kioskToast('Notificaciones activadas');render()}catch(e){fail(e.message)}}async function disablePush(){try{await kioskUnsubscribe();render()}catch(e){fail(e.message)}}async function testPush(){try{let r=await kioskApi('test');kioskToast('Prueba: '+r.delivery.status+' · '+r.delivery.sent+' dispositivos')}catch(e){fail(e.message)}}
</script><script type="module" src="/firebase-client.js"></script></html>
