const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n||0), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2), date=x=>new Date(x).toLocaleString('es-AR'), round=n=>Math.round(n/100)*100;
let db={products:[],sessions:[],active:null,moves:[],audit:[]}, page='Mostrador',cart=[],busy=false,newProductId=null;const  current=()=>db.sessions.find(s=>s.id===db.active), sum=a=>a.reduce((n,x)=>n+x,0), sales=s=>s?.sales||[], totals=s=>Object.fromEntries(['Efectivo','Débito','Crédito','Transferencia','QR','Mercado Pago'].map(m=>[m,sum(sales(s).flatMap(v=>v.payments.filter(p=>p.method===m).map(p=>p.amount)))])), revenue=s=>sum(sales(s).map(v=>v.total)), expected=s=>s.open+totals(s).Efectivo+sum(s.moves.map(m=>m.amount));
const table=(heads,rows)=>`<div class="table"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}" class="muted">Sin registros todavía.</td></tr>`}</tbody></table></div>`, field=(label,id,type='text',value='',extra='')=>`<div><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" ${extra}></div>`, card=(label,value)=>`<div class="panel"><div class="muted">${label}</div><div class="big">${value}</div></div>`;function go(p){page=p;render()}function show(html){$('modal').innerHTML=html;$('modal').showModal()}function closeModal(){$('modal').close()}function fail(t){alert(t)}function render(){const s=current();$('nav').innerHTML=['Mostrador',...(db.user?.role!=='cashier'?['Stock y precios']:[]),'Caja actual','Historial de cajas',...(db.user?.role!=='cashier'?['Estadísticas']:[]),...(db.user?.role==='admin'?['Notificaciones']:[]),'Configuración'].map(p=>`<button class="${p===page?'active':''}" onclick="go('${p}')">${p}</button>`).join('');$('title').textContent=page;$('userLabel').textContent=db.user?.name||'';$('status').textContent=s?'Caja abierta · '+s.operator:'Caja cerrada';let v=$('view');if(page==='Mostrador'){v.innerHTML=`<div class="grid">${card('Ventas de la caja',money(revenue(s)))}${card('Operaciones',sales(s).length)}${card('Productos con stock bajo',db.products.filter(p=>p.qty<=p.min).length)}</div>${!s?'<div class="panel"><h3>Abrí una caja para empezar a vender</h3><button onclick="openCash()">Abrir caja</button></div>':''}<div class="two"><div class="panel"><h3>Buscar o escanear producto</h3><input id="scan" placeholder="Código de barras o nombre" autocomplete="off" oninput="catalog(this.value)" onkeydown="if(event.key===\'Enter\'){scanCode(this.value);event.preventDefault()}"><div id="catalog"></div></div><div class="panel"><h3>Venta actual</h3><div id="cart"></div></div></div>`;catalog('');drawCart();$('scan').focus()}else if(page==='Stock y precios'){v.innerHTML=`<div class="actions" style="margin:0 0 16px"><button onclick="editProduct()">+ Nuevo producto</button><button class="secondary" onclick="exportStock()">Exportar stock CSV</button></div><div class="panel"><input id="filter" placeholder="Buscar por nombre, categoría o código" oninput="stockTable(this.value)"><div id="stockTable"></div></div><div class="panel"><h3>Movimientos de inventario</h3>${table(['Fecha','Producto','Cantidad','Motivo','Responsable'],db.moves.slice().reverse().map(m=>[date(m.at),esc(m.name),m.delta,esc(m.reason),esc(m.actor?.name||'—')]))}</div>`;stockTable('')}else if(page==='Caja actual'){v.innerHTML=s?`<div class="grid">${card('Fondo inicial',money(s.open))}${card('Ventas totales',money(revenue(s)))}${card('Efectivo esperado',money(expected(s)))}</div><div class="panel"><h3>${esc(s.operator)} · ${date(s.at)}</h3>${report(s)}<div class="actions"><button onclick="movement()">Ingreso / retiro</button><button class="secondary" onclick="reportModal('${s.id}')">Ver informe</button><button class="danger" onclick="closeCash()">Cerrar caja</button></div></div>`:`<div class="panel"><h3>No hay caja abierta</h3><button onclick="openCash()">Abrir caja</button></div>`}else if(page==='Historial de cajas'){v.innerHTML=`<div class="panel">${table(['Apertura','Cierre','Responsable','Ventas','Diferencia','Informe'],db.sessions.slice().reverse().map(s=>[date(s.at),s.closed?date(s.closed):'Abierta',esc(s.operator),money(revenue(s)),s.closed?money(s.counted-expected(s)):'—',`<button onclick="reportModal('${s.id}')">Ver informe</button>`]))}</div>`}else if(page==='Estadísticas'){let all=db.sessions.flatMap(s=>s.sales), qty={};all.forEach(v=>v.items.forEach(i=>{qty[i.name]=(qty[i.name]||0)+i.qty}));v.innerHTML=`<div class="grid">${card('Ventas históricas',money(sum(all.map(v=>v.total))))}${card('Ganancia bruta estimada',money(sum(all.flatMap(v=>v.items.map(i=>(i.price-i.cost)*i.qty)))))}${card('Valor de stock al costo',money(sum(db.products.map(p=>p.cost*p.qty))))}</div><div class="panel"><h3>Productos más vendidos</h3>${table(['Producto','Unidades'],Object.entries(qty).sort((a,b)=>b[1]-a[1]).map(([n,q])=>[esc(n),q]))}</div>`}else if(page==='Notificaciones'){v.innerHTML=`<div class="panel"><h3>Actividad y notificaciones</h3><p class="muted">Últimas 100 operaciones. Las notificaciones push se envían a los dispositivos registrados de administración.</p>${table(['Fecha','Evento','Detalle','Responsable','Push'],(db.audit||[]).map(a=>[date(a.at),esc(a.action==='sale'&&!a.notify?'Venta':a.title),esc(a.body),esc(a.actor?.email),esc(a.notify?(a.delivery?.status||'Pendiente'):'No corresponde')]))}</div>`}else{v.innerHTML=`<div class="panel"><h3>Cuenta y respaldo</h3><p>Sesión: ${esc(db.user?.email)} · ${esc(db.user?.role)}</p><p class="muted">Los datos se almacenan en Firebase. El respaldo es de consulta, no se restaura automáticamente.</p>${db.user?.role!=='cashier'?`<div class="actions"><button onclick="download('kiosco-respaldo.json',JSON.stringify(db,null,2),'application/json')">Descargar respaldo</button></div>`:''}</div>${db.user?.role==='admin'?`<div class="panel"><h3>Notificaciones push</h3><p id="pushStatus">${window.kioskPushActive?.()?'Registradas en este dispositivo':'No activadas en este dispositivo'}</p><div class="actions"><button onclick="activatePush()">Activar</button><button class="secondary" onclick="testPush()">Probar</button><button class="secondary" onclick="disablePush()">Desactivar</button></div></div>`:''}`}}

function catalog(q){q=q.toLowerCase();$('catalog').innerHTML=table(['Producto','Stock','Precio',''],db.products.filter(p=>`${p.name} ${p.code}`.toLowerCase().includes(q)).slice(0,30).map(p=>[esc(p.name),p.qty,money(p.price),`<button onclick="add('${p.id}')">+</button>`]))}function scanCode(q){let p=db.products.find(p=>p.code===q.trim());if(p){add(p.id);$('scan').value='';catalog('')}else{fail('Código no encontrado. Cargá el producto en Stock.')}}function add(id){if(!current())return fail('Primero abrí una caja');let p=db.products.find(p=>p.id===id),i=cart.find(i=>i.id===id);if(!p)return fail('Producto no disponible');if((i?.qty||0)>=p.qty)return fail('Stock insuficiente');if(i)i.qty++;else cart.push({...p,qty:1});drawCart();$('scan')?.focus()}function change(id,d){let i=cart.find(i=>i.id===id),p=db.products.find(p=>p.id===id);if(!p||i.qty+d>p.qty)return fail('Stock insuficiente');i.qty+=d;cart=cart.filter(i=>i.qty>0);drawCart()}function drawCart(){let c=$('cart');if(!c)return;let total=sum(cart.map(i=>i.qty*i.price));c.innerHTML=table(['Producto','Cant.','Subtotal'],cart.map(i=>[esc(i.name),`<button class="secondary" onclick="change('${i.id}',-1)">−</button> ${i.qty} <button class="secondary" onclick="change('${i.id}',1)">+</button>`,money(i.qty*i.price)]))+`<p class="muted">Total a cobrar</p><div class="total">${money(total)}</div><div class="actions"><button onclick="checkout()" ${cart.length?'':'disabled'}>Cobrar venta</button><button class="secondary" onclick="cart=[];drawCart()">Cancelar</button></div>`}
function openCash(){show(`<h2>Apertura de caja</h2><form onsubmit="event.preventDefault();startCash()"><p>Responsable: <b>${esc(db.user.name)}</b></p>${field('Fondo inicial en efectivo','opening','number',0,'min="0" required')}<div class="actions"><button>Abrir caja</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function startCash(){if(current())return;await mutateUI('open',{open:+$('opening').value})}function checkout(){if(!cart.length||!current())return;let t=sum(cart.map(i=>i.qty*i.price));show(`<h2>Cobrar ${money(t)}</h2><form onsubmit="event.preventDefault();commitSale()"><p class="muted">Ingresá los importes por medio de pago. Permite pagos combinados.</p>${['Efectivo','Débito','Crédito','Transferencia','QR','Mercado Pago'].map((m,i)=>field(m,'pay'+i,'number',i===0?t:0,'min="0" step="1" oninput="paymentBalance()"')).join('')}<p id="balancePay"></p><div class="actions"><button>Confirmar venta</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`);paymentBalance()}function paymentBalance(){let t=sum(cart.map(i=>i.qty*i.price)),p=sum([0,1,2,3,4,5].map(i=>+$('pay'+i).value));$('balancePay').textContent='Pendiente: '+money(Math.max(0,t-p))+' · Vuelto en efectivo: '+money(Math.max(0,p-t))}async function commitSale(){let s=current(),total=sum(cart.map(i=>i.qty*i.price)),payments=['Efectivo','Débito','Crédito','Transferencia','QR','Mercado Pago'].map((method,i)=>({method,amount:+$('pay'+i).value}));let excess=sum(payments.map(p=>p.amount))-total;if(!s||excess<0||payments.some(p=>p.amount<0)||excess>payments[0].amount)return fail('Revisá los importes');payments[0].amount-=excess;await mutateUI('sale',{sessionId:s.id,items:cart.map(i=>({id:i.id,qty:i.qty,price:i.price})),payments:payments.filter(p=>p.amount>0)},()=>{cart=[]})}function stockTable(q){q=q.toLowerCase();$('stockTable').innerHTML=table(['Código','Producto','Costo','Recargo','Precio','Stock','Última modificación',''],db.products.filter(p=>`${p.code} ${p.name} ${p.category}`.toLowerCase().includes(q)).map(p=>[esc(p.code),esc(p.name),money(p.cost),p.margin+'%',money(p.price),`<span class="${p.qty<=p.min?'warn':''}">${p.qty}</span>`,esc(p.updatedBy?.name||'—')+(p.updatedAt?' · '+date(p.updatedAt):''),`<button class="secondary" onclick="editProduct('${p.id}')">Editar</button> <button onclick="adjust('${p.id}')">Stock</button>`]))}function editProduct(id){newProductId=id||uid();let p=db.products.find(p=>p.id===id)||{code:'',name:'',category:'',cost:0,margin:30,price:0,qty:0,min:5};show(`<h2>${id?'Editar':'Nuevo'} producto</h2><form onsubmit="event.preventDefault();storeProduct('${id||''}')"><div class="grid">${field('Código de barras (EAN-13 u otro)','code','text',p.code,'autocomplete="off" onkeydown="if(event.key===\'Enter\'){event.preventDefault();document.getElementById(\'name\').focus()}"')}${field('Nombre','name','text',p.name,'required')}${field('Categoría','category','text',p.category)}${field('Costo unitario','cost','number',p.cost,'min="0" step="0.01" required oninput="suggest()"')}${field('Recargo sobre costo (%)','margin','number',p.margin,'min="0" step="0.01" oninput="suggest()"')}${field('Precio de venta','price','number',p.price,'min="0" step="1" required')}${field('Stock actual','qty','number',p.qty,'min="0" step="1" required '+(id?'readonly':''))}${field('Stock mínimo','min','number',p.min,'min="0" step="1" required')}</div><p id="suggestion"></p><button type="button" class="secondary" onclick="suggest(true)">Aplicar precio sugerido</button><div class="actions"><button>Guardar producto</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`);suggest(!id);$('code').focus()}function suggest(apply=false){let c=+$('cost').value,m=+$('margin').value,n=c*(1+m/100),r=round(n);$('suggestion').textContent='Precio calculado: '+money(n)+' · Sugerido redondeado: '+money(r);if(apply||!$('price').value||+$('price').value===0)$('price').value=r}async function storeProduct(id){let old=db.products.find(p=>p.id===id),p={id:id||newProductId,code:$('code').value.trim(),name:$('name').value.trim(),category:$('category').value.trim(),cost:+$('cost').value,margin:+$('margin').value,price:+$('price').value,qty:+$('qty').value,min:+$('min').value};await mutateUI('product',{product:p,edit:!!id,version:old?.updatedAt||null})}function adjust(id){let p=db.products.find(p=>p.id===id);show(`<h2>Movimiento de stock</h2><p>${esc(p.name)} · Disponible: ${p.qty}</p><form onsubmit="event.preventDefault();applyAdjust('${id}')">${field('Cantidad (negativa para retirar)','delta','number',0,'step="1" required')}${field('Motivo','reason','text','','required')}<div class="actions"><button>Guardar</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function applyAdjust(id){await mutateUI('adjust',{id,delta:+$('delta').value,reason:$('reason').value.trim()})}function movement(){show(`<h2>Ingreso o retiro de efectivo</h2><form onsubmit="event.preventDefault();applyMovement()">${field('Importe (negativo para retiro)','amount','number',0,'required step="1"')}${field('Motivo','reason','text','','required')}<div class="actions"><button>Guardar</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function applyMovement(){await mutateUI('cashMove',{sessionId:current()?.id,amount:+$('amount').value,reason:$('reason').value.trim()})}function closeCash(){let s=current();if(cart.length)return fail('Finalizá o cancelá la venta pendiente');show(`<h2>Cierre de caja</h2><p>Efectivo esperado: <b>${money(expected(s))}</b></p><form onsubmit="event.preventDefault();finishCash()"><p>Responsable: <b>${esc(db.user.name)}</b></p>${field('Efectivo contado','counted','number','','min="0" required step="1"')}${field('Observaciones','notes')}<div class="actions"><button class="danger">Confirmar cierre</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function finishCash(){let s=current();if(!s)return;await mutateUI('close',{sessionId:s.id,counted:+$('counted').value,notes:$('notes').value},()=>{page='Historial de cajas'},()=>reportModal(s.id))}function report(s){let qty={};sales(s).forEach(v=>v.items.forEach(i=>{let k=i.id;if(!qty[k])qty[k]={name:i.name,qty:0,total:0};qty[k].qty+=i.qty;qty[k].total+=i.qty*i.price}));return `<p>Fondo inicial: <b>${money(s.open)}</b> · Ventas: <b>${money(revenue(s))}</b></p><h3>Medios de pago</h3>${table(['Medio','Total'],Object.entries(totals(s)).map(([m,a])=>[m,money(a)]))}<h3 style="margin-top:18px">Arqueo de efectivo</h3>${table(['Concepto','Importe'],[['Fondo inicial',money(s.open)],['Ventas en efectivo',money(totals(s).Efectivo)],['Ingresos / retiros',money(sum(s.moves.map(m=>m.amount)))],['Efectivo esperado',money(expected(s))],...(s.closed?[['Efectivo contado',money(s.counted)],['Diferencia',money(s.counted-expected(s))]]:[])])}<h3 style="margin-top:18px">Productos vendidos</h3>${table(['Producto','Cantidad','Total'],Object.values(qty).map(i=>[esc(i.name),i.qty,money(i.total)]))}<h3 style="margin-top:18px">Detalle de ventas</h3>${table(['Hora','Responsable','Productos','Pago','Total'],sales(s).map(v=>[date(v.at),esc(v.actor?.name||'—'),v.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>'),v.payments.map(p=>esc(p.method)+' '+money(p.amount)).join('<br>'),money(v.total)]))}<h3 style="margin-top:18px">Movimientos de efectivo</h3>${table(['Fecha','Motivo','Importe','Responsable'],s.moves.map(m=>[date(m.at),esc(m.reason),money(m.amount),esc(m.actor?.name||'—')]))}`}function reportModal(id){let s=db.sessions.find(s=>s.id===id);show(`<h2>Informe de caja</h2><p>Apertura: ${date(s.at)} · ${esc(s.operator)}<br>Cierre: ${s.closed?date(s.closed)+' · '+esc(s.closer):'Pendiente'}<br>${esc(s.notes||'')}</p>${report(s)}<div class="actions"><button onclick="window.print()">Imprimir / guardar PDF</button><button class="secondary" onclick="shareReport('${id}')">Compartir resumen</button><button class="secondary" onclick="closeModal()">Cerrar</button></div>`)}async function shareReport(id){let s=db.sessions.find(s=>s.id===id),text=`Informe de caja\n${date(s.at)}\nResponsable: ${s.operator}\nVentas: ${money(revenue(s))}\n`+Object.entries(totals(s)).map(([m,a])=>m+': '+money(a)).join('\n')+'\nEfectivo esperado: '+money(expected(s))+(s.closed?'\nDiferencia: '+money(s.counted-expected(s)):'');try{if(navigator.share)await navigator.share({title:'Informe de caja',text});else download('informe-caja.txt',text,'text/plain')}catch(e){if(e.name!=='AbortError')download('informe-caja.txt',text,'text/plain')}}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportStock(){let csv=[['Código','Nombre','Categoría','Costo','Recargo','Precio','Stock'],...db.products.map(p=>[p.code,p.name,p.category,p.cost,p.margin,p.price,p.qty])].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');download('stock.csv','\uFEFF'+csv,'text/csv')}async function restore(){fail('La restauración de respaldos requiere una migración administrativa.')}
let toastTimer;window.kioskToast=t=>{let e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,5000)};
window.kioskLocked=()=>{db={products:[],sessions:[],active:null,moves:[],audit:[]};cart=[];page='Mostrador';if($('modal').open)closeModal();$('app').hidden=true;$('login').hidden=false};
window.kioskReady=state=>{db=state;$('login').hidden=true;$('app').hidden=false;render()};
window.kioskPage=()=>page;window.kioskRefresh=async()=>{db=await kioskApi();render()};async function refreshUI(){if(busy)return;try{await kioskRefresh()}catch(e){fail(e.message)}}
let pendingRequest=null;async function mutateUI(action,data,onCommit=()=>{},after=()=>{}){if(busy)return;busy=true;let buttons=[...$('modal').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);const signature=JSON.stringify({action,data});if(!pendingRequest||pendingRequest.signature!==signature)pendingRequest={signature,id:uid()};try{let result=await kioskApi(action,data,pendingRequest.id);pendingRequest=null;onCommit();if($('modal').open)closeModal();try{await kioskRefresh();after()}catch(e){kioskToast('Operación registrada; actualizá la pantalla. '+e.message);return}kioskToast('Operación registrada'+(result.delivery?.status==='error de envío'?' · Push pendiente de revisión':''))}catch(e){fail(e.message)}finally{busy=false;buttons.forEach(b=>b.disabled=false)}}
async function activatePush(){try{await kioskSubscribe();kioskToast('Notificaciones activadas');render()}catch(e){fail(e.message)}}async function disablePush(){try{await kioskUnsubscribe();render()}catch(e){fail(e.message)}}async function testPush(){try{let r=await kioskApi('test');kioskToast('Prueba: '+r.delivery.status+' · '+r.delivery.sent+' dispositivos')}catch(e){fail(e.message)}}
</script><script type="module" src="/firebase-client.js"></script></html>
