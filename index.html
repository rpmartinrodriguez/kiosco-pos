function drawStats(){const f=statsFilters,query=norm(f.product),products=new Map(db.products.map(p=>[p.id,p])),all=db.sessions.flatMap(s=>sales(s)).filter(v=>inRange(v.at,f.from,f.to)&&(f.hour===''||hourKey(v.at)===Number(f.hour))).map(v=>({...v,items:v.items.filter(i=>!query||norm(i.name+' '+(products.get(i.id)?.code||'')).includes(query))})).filter(v=>v.items.length),rank=rankItems(all);if(f.sort==='total')rank.sort((a,b)=>b.total-a.total||b.qty-a.qty);const max=rank.reduce((m,p)=>Math.max(m,p[f.sort]),0)||1;const hours=Array.from({length:24},(_,hour)=>{const list=all.filter(v=>hourKey(v.at)===hour),rank=rankItems(list);return {hour,qty:sum(rank.map(p=>p.qty)),total:sum(rank.map(p=>p.total)),count:list.length,rank}}).filter(x=>x.count).sort((a,b)=>b.total-a.total||b.qty-a.qty);const peak=hours[0],peakQty=[...hours].sort((a,b)=>b.qty-a.qty)[0],time=h=>String(h).padStart(2,'0')+':00–'+String(h).padStart(2,'0')+':59';$('statsResults').innerHTML=`<div class="panel"><div class="toolbar"><div><h3>Productos más vendidos</h3><p class="section-note">${rank.length} productos · ${fmtNumber(sum(rank.map(p=>p.qty)))} unidades vendidas</p></div><span class="pill">Ranking por ${f.sort==='total'?'importe':'cantidad'}</span></div>${table(['#','Producto','Unidades','Venta total','Ganancia bruta'],rank.map((p,i)=>[i+1,esc(p.name)+'<div class="ranking-bar"><i style="width:'+Math.max(0,p[f.sort]/max*100)+'%"></i></div>',fmtNumber(p.qty),money(p.total),money(p.total-p.cost)]))}</div><div class="metrics" style="margin-bottom:14px"><div class="metric accent"><span class="muted">Franja de mayor facturación</span><strong>${peak?time(peak.hour):'—'}</strong><p class="section-note">${peak?money(peak.total):'Sin ventas'}</p></div><div class="metric"><span class="muted">Franja con más unidades vendidas</span><strong>${peakQty?time(peakQty.hour):'—'}</strong><p class="section-note">${peakQty?fmtNumber(peakQty.qty)+' unidades':'Sin ventas'}</p></div></div><div class="panel"><h3>Ventas por horari function adjust(id){let p=db.products.find(p=>p.id===id),pack=p.packSize>1;show(`<h2>Reponer / ajustar stock</h2><p><b>${esc(p.name)}</b> · Disponible: ${fmtNumber(p.qty)} unidades</p><form onsubmit="event.preventDefault();applyAdjust('${id}')"><div class="metrics"><div class="metric"><span class="muted">Costo anterior por unidad</span><strong>${money(p.cost)}</strong></div><div class="metric"><span class="muted">Precio de venta actual</span><strong>${money(p.price)}</strong></div></div><div class="form-section" style="margin-top:18px"><h3>Compra</h3><div class="form-grid"><div><label for="adjustMode">Presentación</label><select id="adjustMode" onchange="adjustPreview(true)"><option value="unit" ${!pack?'selected':''}>Unidades</option><option value="pack" ${pack?'selected':''}>Packs / bultos</option></select></div><div id="adjustPack">${field('Unidades por pack','adjustSize','number',p.packSize||1,'min="1" step="1" oninput="adjustPreview(true)"')}</div>${field('Cantidad comprada','delta','number',1,'step="1" required oninput="adjustPreview(true)"')}${field('Nuevo costo de compra (opcional)','adjustCost','number','','min="0" step="0.01" oninput="adjustPreview(true)"')}<div class="span2">${field('Motivo','reason','text','Ingreso de mercadería','required')}</div></div><p id="adjustSummary" class="section-note"></p><div id="costAlert" class="notice" hidden role="alert"></div></div><div id="adjustPriceBox" class="price-hero" hidden><label for="adjustPrice">Nuevo precio de venta (editable)</label><input id="adjustPrice" data-number inputmode="decimal" min="1" step="1" disabled><p id="adjustSuggestion" class="section-note"></p><button type="button" class="secondary" onclick="adjustPreview(true)">Restablecer sugerido</button></div><div class="actions"><button type="button" class="secondary" onclick="closeModal()">Cancelar</button><button>Guardar reposición</button></div></form>`);$('adjustMode').dataset.product=id;adjustPreview(true)}
function adjustPreview(reset=false){const pack=$('adjustMode').value==='pack';$('adjustPack').hidden=!pack;$('adjustSize').disabled=!pack;const size=pack?readNum('adjustSize'):1,delta=readNum('delta')*size,p=db.products.find(x=>x.id===$('adjustMode').dataset.product),cost=readNum('adjustCost'),hasCost=$('adjustCost').value.trim()!=='',newCost=cost/size;document.querySelector('label[for="delta"]').textContent=pack?'Cantidad de packs (negativa para retirar)':'Cantidad de unidades (negativa para retirar)';document.querySelector('label[for="adjustCost"]').textContent=pack?'Precio de compra del pack (opcional)':'Precio de compra por unidad (opcional)';const valid=Number.isSafeInteger(delta)&&Number.isSafeInteger(size)&&size>=1,pricing=valid&&hasCost&&delta>0&&Number.isFinite(newCost)&&newCost>=0;$('adjustSummary').textContent=valid?'Movimiento: '+fmtNumber(delta)+' unidades · Stock final: '+fmtNumber(p.qty+delta):'Revisá la cantidad ingresada';$('costAlert').hidden=!pricing||newCost<=p.cost;$('costAlert').textContent=pricing&&newCost>p.cost?'Aumento de costo: '+money(p.cost)+' → '+money(newCost)+' por unidad'+(p.cost>0?' (+'+fmtNumber((newCost/p.cost-1)*100)+' %)':'')+'. Revisá el precio de venta antes de guardar.':'';$('adjustPriceBox').hidden=!pricing;$('adjustPrice').disabled=!pricing;$('adjustPrice').required=pricing;if(pricing){const suggested=round(newCost*(1+p.margin/100));$('adjustSuggestion').textContent='Costo por unidad: '+money(newCost)+' · Sugerido: '+money(suggested);if(reset){$('adjustPrice').value=fmtNumber(suggested);validateNumber($('adjustPrice'))}}}
async function applyAdjust(id){const pack=$('adjustMode').value==='pack',size=pack?readNum('adjustSize'):1,count=readNum('delta'),delta=count*size,hasCost=$('adjustCost').value.trim()!=='',p=db.products.find(x=>x.id===id),price=hasCost?readNum('adjustPrice'):undefined;if(!Number.isSafeInteger(size)||size<1||!Number.isSafeInteger(delta)||!delta||(hasCost&&(delta<0||!Number.isFinite(readNum('adjustCost'))||readNum('adjustCost')<0||!Number.isSafeInteger(price)||price<1)))return fail('Revisá el movimiento. Solo se actualiza el costo en ingresos de mercadería.');await mutateUI('adjust',{id,delta,version:p.updatedAt,reason:$('reason').value.trim(),...(hasCost?{price}:{}),purchase:{mode:pack?'pack':'unit',unitsPerPack:size,count,...(hasCost?{cost:readNum('adjustCost')}:{})}})}
async function productHistory(id){const p=db.products.find(x=>x.id===id);if(!p)return;show(`<h2>Historial · ${esc(p.name)}</h2><div id="productHistoryBody" data-product="${esc(id)}"><p class="muted">Cargando movimientos y cambios…</p></div><div class="actions"><button class="secondary" onclick="closeModal()">Cerrar</button></div>`,true);try{const result=await kioskApi('productHistory',{id}),el=$('productHistoryBody');if(!el||el.dataset.product!==id||!$('modal').open)return;const entries=[...(result.events||[]).map(e=>({...e,kind:'event'})),...(result.moves||[]).map(m=>({...m,title:'Venta · descuento de stock',kind:'sale'}))].sort((a,b)=>b.at-a.at);el.innerHTML=entries.length?entries.map(e=>{const d=e.details||{},changes=[];if(e.kind==='sale')changes.push('Stock: '+fmtNumber(e.delta)+' u.');else if(e.action==='product'){const before=d.before||{},after=d.after||{};for(const [k,label,format] of [['name','Nombre',String],['code','Código',String],['category','Categoría',String],['cost','Costo unitario',money],['margin','Ganancia',x=>fmtNumber(x)+'%'],['price','Precio',money],['qty','Stock',fmtNumber],['min','Stock crítico',fmtNumber],['packSize','Unidades por pack',fmtNumber]])if(after[k]!==undefined&&before[k]!==after[k])changes.push(label+': '+(before[k]===undefined?'—':format(before[k]))+' → '+format(after[k]))}else{if(d.before!==undefined)changes.push('Stock: '+fmtNumber(d.before)+' → '+fmtNumber(d.after));if(d.costAfter!==undefined)changes.push('Costo: '+money(d.costBefore)+' → '+money(d.costAfter));if(d.priceAfter!==undefined)changes.push('Precio: '+money(d.priceBefore)+' → '+money(d.priceAfter))}return `<div class="history-entry"><b>${esc(e.title)}</b><p class="muted small">${date(e.at)} · ${esc(e.actor?.name||e.actor?.email||'Sin responsable')}</p><div class="hist-values">${changes.map(x=>'<span>'+esc(x)+'</span>').join('')}</div>${d.reason?'<p class="section-note">'+esc(d.reason)+'</p>':''}</div>`}).join(''):'<p class="muted">Sin movimientos registrados.</p>'}catch(e){const el=$('productHistoryBody');if(el&&el.dataset.product===id)el.textContent=e.message}}
function movement(){show(`<h2>Ingreso o retiro de efectivo</h2><form onsubmit="event.preventDefault();applyMovement()">${field('Importe (negativo para retiro)','amount','number',0,'required step="1"')}${field('Motivo','reason','text','','required')}<div class="actions"><button>Guardar</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function applyMovement(){await mutateUI('cashMove',{sessionId:current()?.id,amount:readNum('amount'),reason:$('reason').value.trim()})}function closeCash(){let s=current();if(cart.length)return fail('Finalizá o cancelá la venta pendiente');show(`<h2>Cierre de caja</h2><p>Efectivo esperado: <b>${money(expected(s))}</b></p><form onsubmit="event.preventDefault();finishCash()"><p>Abrió: <b>${esc(s.openedBy?.name||s.operator)}</b><br>Cierra: <b>${esc(db.user.name)}</b></p>${field('Efectivo contado','counted','number','','min="0" required step="1"')}${field('Observaciones','notes')}<div class="actions"><button class="danger">Confirmar cierre</button><button type="button" class="secondary" onclick="closeModal()">Cancelar</button></div></form>`)}async function finishCash(){let s=current();if(!s)return;await mutateUI('close',{sessionId:s.id,counted:readNum('counted'),notes:$('notes').value},()=>{page=db.user?.role==='admin'?'Historial de cajas':'Mostrador'},()=>{if(db.user?.role==='admin')reportModal(s.id)})}function report(s){let qty={};sales(s).forEach(v=>v.items.forEach(i=>{let k=i.id;if(!qty[k])qty[k]={name:i.name,qty:0,total:0};qty[k].qty+=i.qty;qty[k].total+=i.qty*i.price}));return `<p>Abrió: <b>${esc(s.openedBy?.name||s.operator)}</b> · Cerró: <b>${esc(s.closedBy?.name||s.closer||'Pendiente')}</b></p><p>Fondo inicial: <b>${money(s.open)}</b> · Ventas: <b>${money(revenue(s))}</b></p>${cashSummary(s)}<h3>Medios de pago</h3>${table(['Medio','Total'],Object.entries(totals(s)).map(([m,a])=>[m,money(a)]))}<h3 style="margin-top:18px">Arqueo de efectivo</h3>${table(['Concepto','Importe'],[['Fondo inicial',money(s.open)],['Ventas en efectivo',money(totals(s).Efectivo)],['Ingresos / retiros',money(sum(s.moves.map(m=>m.amount)))],['Efectivo esperado',money(expected(s))],...(s.closed?[['Efectivo contado',money(s.counted)],['Diferencia',money(s.counted-expected(s))]]:[])])}<h3 style="margin-top:18px">Productos vendidos</h3>${table(['Producto','Cantidad','Total'],Object.values(qty).sort((a,b)=>b.qty-a.qty||b.total-a.total).map(i=>[esc(i.name),fmtNumber(i.qty),money(i.total)]))}<h3 style="margin-top:18px">Detalle de ventas</h3>${table(['Hora','Responsable','Productos','Pago','Total'],sales(s).map(v=>[date(v.at),esc(v.actor?.name||'—'),v.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>'),v.payments.map(p=>esc(p.method)+' '+money(p.amount)).join('<br>'),money(v.total)]))}<h3 style="margin-top:18px">Movimientos de efectivo</h3>${table(['Fecha','Motivo','Importe','Responsable'],s.moves.map(m=>[date(m.at),esc(m.reason),money(m.amount),esc(m.actor?.name||'—')]))}`}function reportModal(id){let s=db.sessions.find(s=>s.id===id);show(`<h2>Informe de caja</h2><p>Apertura: ${date(s.at)} · ${esc(s.openedBy?.name||s.operator)}<br>Cierre: ${s.closed?date(s.closed)+' · '+esc(s.closedBy?.name||s.closer):'Pendiente'}<br>${esc(s.notes||'')}</p>${report(s)}<div class="actions"><button onclick="window.print()">Imprimir / guardar PDF</button><button class="secondary" onclick="shareReport('${id}')">Compartir resumen</button><button class="secondary" onclick="closeModal()">Cerrar</button></div>`,true)}async function shareReport(id){let s=db.sessions.find(s=>s.id===id),text=`Informe de caja\n${date(s.at)}\nAbrió: ${s.openedBy?.name||s.operator}\nCerró: ${s.closedBy?.name||s.closer||'Pendiente'}\nVentas: ${money(revenue(s))}\n`+Object.entries(totals(s)).map(([m,a])=>m+': '+money(a)).join('\n')+'\nEfectivo esperado: '+money(expected(s))+(s.closed?'\nDiferencia: '+money(s.counted-expected(s)):'');try{if(navigator.share)await navigator.share({title:'Informe de caja',text});else download('informe-caja.txt',text,'text/plain')}catch(e){if(e.name!=='AbortError')download('informe-caja.txt',text,'text/plain')}}function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportStock(){let csv=[['Código','Nombre','Categoría','Costo','Recargo','Precio','Stock'],...db.products.map(p=>[p.code,p.name,p.category,fmtNumber(p.cost),fmtNumber(p.margin),fmtNumber(p.price),fmtNumber(p.qty)])].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');download('stock.csv','\uFEFF'+csv,'text/csv')}async function restore(){fail('La restauración de respaldos requiere una migración administrativa.')}
function passwordField(label,id){return `<div><label for="${id}">${label}</label><div class="password-wrap"><input type="password" id="${id}" minlength="8" maxlength="128" autocomplete="new-password" required><button type="button" class="secondary" aria-label="Mostrar contraseña" aria-pressed="false" onclick="togglePassword('${id}',this)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>`}
function togglePassword(id,btn){const input=$(id),visible=input.type==='password';input.type=visible?'text':'password';btn.setAttribute('aria-label',visible?'Ocultar contraseña':'Mostrar contraseña');btn.setAttribute('aria-pressed',String(visible));btn.style.opacity=visible?'.65':'1'}
function usersPanel(){return `<div class="panel"><div class="toolbar"><div><h3>Usuarios y permisos</h3><p class="section-note">Administrá las cuentas del equipo.</p></div><button onclick="newUser()">+ Agregar usuario</button></div>${table(['Nombre','Correo','Perfil','Estado',''],(db.users||[]).map((u,i)=>[esc(u.name),esc(u.email),roleLabel(u.role),u.active?(u.mustChangePassword?'Contraseña temporal':'Activo'):'Inactivo',u.active?`<button class="secondary" onclick="resetUser(${i})">Recuperar contraseña</button>`:'—']))}</div>`}
function defaultUserEmail(){const input=$('newEmail');if(input.dataset.manual==='1')return;const name=norm($('newName').value).split(/\s+/)[0]?.replace(/[^a-z0-9]/g,'');if(!name){input.value='';return}const exists=new Set((db.users||[]).map(u=>String(u.email).toLowerCase()));let email=name+'@kiosco.com',n=2;while(exists.has(email))email=name+(n++)+'@kiosco.com';input.value=email}
function newUser(){if(db.user?.role!=='admin')return;show(`<h2>Agregar usuario</h2><p class="muted">El correo se sugiere a partir del nombre. Podés editarlo.</p><form onsubmit="event.preventDefault();saveUser()"><div class="form-grid"><div class="span2">${field('Nombre y apellido','newName','text','','required maxlength="100" autocomplete="off" oninput="defaultUserEmail()"')}</div><div class="span2">${field('Correo de acceso','newEmail','email','','required autocomplete="off" oninput="this.dataset.manual=this.value?\'1\':\'0\'"')}</div><div class="span2">${passwordField('Contraseña inicial temporaria (mín. 8 caracteres)','newPassword')}</div><div class="span2"><label for="newRole">Perfil de acceso</label><select id="newRole"><option value="cashier">Cobrador</option><option value="admin">Administrador</option></select></div></div><div class="notice">El usuario tendrá que crear su propia contraseña en el primer ingreso.</div><div class="actions"><button class="secondary" type="button" onclick="closeModal()">Cancelar</button><button>Crear usuario</button></div></form>`);$('newName').focus()}
async function saveUser(){if(db.user?.role!=='admin')return;await mutateUI('createUser',{name:$('newName').value.trim(),email:$('newEmail').value.trim(),password:$('newPassword').value,role:$('newRole').value})}
function resetUser(i){if(db.user?.role!=='admin')return;const u=db.users[i];if(!u)return;show(`<h2>Recuperar contraseña</h2><p><b>${esc(u.name)}</b> · ${esc(u.email)}</p><form onsubmit="event.preventDefault();saveReset(${i})"><div class="form-grid"><div class="span2">${passwordField('Nueva contraseña temporaria','temporaryPassword')}</div></div><div class="notice">Se invalidarán las sesiones anteriores. En el siguiente acceso, esta persona deberá elegir una contraseña nueva y personal.</div><div class="actions"><button class="secondary" type="button" onclick="closeModal()">Cancelar</button><button>Asignar contraseña temporal</button></div></form>`)}
async function saveReset(i){if(busy||db.user?.role!=='admin')return;const u=db.users[i];if(!u)return;busy=true;const buttons=[...$('modal').querySelectorAll('button')];buttons.forEach(x=>x.disabled=true);try{const r=await kioskApi('resetPassword',{email:u.email,password:$('temporaryPassword').value});closeModal();if(r.self){await window.kioskSignOutForPassword();return}await kioskRefresh();kioskToast('Contraseña temporaria asignada')}catch(e){fail(e.message)}finally{busy=false;buttons.forEach(x=>x.disabled=false)}}
window.kioskPasswordGate=(state)=>{db={products:[],sessions:[],active:null,moves:[],audit:[],user:state.user};cart=[];$('app').hidden=true;$('login').hidden=true;const root=$('passwordGate');root.hidden=false;root.innerHTML=`<div class="panel reset-box"><h2>KIOSCO / POS</h2><h3>Cambiá tu contraseña</h3><p class="muted">${esc(state.user.email)}</p>${state.resetPending?'<div class="notice">El restablecimiento todavía no está confirmado. Contactá a administración o volvé a iniciar sesión.</div>':`<form onsubmit="event.preventDefault();completePassword()"><p class="muted">Por seguridad necesitás elegir una contraseña personal antes de ingresar.</p>${passwordField('Contraseña temporaria actual','currentTemporary')}${passwordField('Nueva contraseña personal','personalPassword')}${passwordField('Repetir contraseña','confirmPassword')}<p id="changeError" class="warn" aria-live="polite"></p><div class="actions"><button id="changeButton">Cambiar contraseña</button></div></form>`}<div class="actions"><button class="secondary" onclick="kioskSignOutForPassword()">Volver al inicio de sesión</button></div></div>`}
async function completePassword(){const p=$('personalPassword').value;if(p!==$('confirmPassword').value){$('changeError').textContent='Las contraseñas no coinciden.';return}if(p===$('currentTemporary').value){$('changeError').textContent='Elegí una contraseña diferente de la temporal.';return}$('changeButton').disabled=true;try{await kioskApi('changePassword',{password:p,temporary:$('currentTemporary').value});await window.kioskSignOutForPassword();kioskToast('Contraseña actualizada. Ingresá con la nueva contraseña.')}catch(e){if($('changeError'))$('changeError').textContent=e.message;else fail(e.message)}finally{if($('changeButton'))$('changeButton').disabled=false}}
let toastTimer;window.kioskToast=t=>{let e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.hidden=true,5000)};
window.kioskLocked=()=>{db={products:[],sessions:[],active:null,moves:[],audit:[]};cart=[];selectedProduct=null;cashFilters={from:'',to:'',operator:''};statsFilters={from:'',to:'',product:'',hour:'',sort:'qty'};pendingRequest=null;page='Mostrador';$('passwordGate').hidden=true;$('passwordGate').innerHTML='';if($('modal').open)closeModal();$('app').hidden=true;$('login').hidden=false};
window.kioskReady=state=>{if(state.mustChangePassword){window.kioskPasswordGate(state);return}db=state;$('passwordGate').hidden=true;$('login').hidden=true;$('app').hidden=false;render()};
window.kioskPage=()=>page;window.kioskRefresh=async()=>{const state=await kioskApi();if(state.mustChangePassword){window.kioskPasswordGate(state);return}db=state;render()};async function refreshUI(){if(busy)return;try{await kioskRefresh()}catch(e){fail(e.message)}}
let pendingRequest=null;async function mutateUI(action,data,onCommit=()=>{},after=()=>{}){if(busy)return;busy=true;let buttons=[...$('modal').querySelectorAll('button')];buttons.forEach(b=>b.disabled=true);const signature=JSON.stringify({action,data:action==='createUser'?{...data,password:undefined}:data});if(!pendingRequest||pendingRequest.signature!==signature)pendingRequest={signature,id:uid()};try{let result=await kioskApi(action,data,pendingRequest.id);pendingRequest=null;onCommit();if($('modal').open)closeModal();try{await kioskRefresh();after()}catch(e){kioskToast('Operación registrada; actualizá la pantalla. '+e.message);return}kioskToast('Operación registrada'+(result.delivery?.status==='error de envío'?' · Push pendiente de revisión':''))}catch(e){if(action==='createUser')pendingRequest=null;fail(e.message)}finally{busy=false;buttons.forEach(b=>b.disabled=false)}}
async function activatePush(){try{await kioskSubscribe();kioskToast('Notificaciones activadas');render()}catch(e){fail(e.message)}}async function disablePush(){try{await kioskUnsubscribe();render()}catch(e){fail(e.message)}}async function testPush(){try{let r=await kioskApi('test');kioskToast('Prueba: '+r.delivery.status+' · '+r.delivery.sent+' dispositivos')}catch(e){fail(e.message)}}
</script><script type="module" src="/firebase-client.js"></script></html>
